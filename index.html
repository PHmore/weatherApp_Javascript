<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoreWeather</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>

  <body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="border-bottom">
      <div class="container py-3">
        <h1 class="h4 m-0">MoreWeather</h1>
      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-fill">
      <div class="container my-4">

        <!-- SEARCH SECTION -->
        <section class="mb-5">
            <form id="search-form" class="row g-2">
                <div class="col-sm-10">
                    <input
                    id="city-input"
                    type="text"
                    class="form-control"
                    placeholder="Search for a city..."
                    >
                </div>

                <div class="col-sm-2 d-grid">
                    <button class="btn btn-primary" type="submit">
                    Search
                    </button>
                </div>
            </form>
        </section>

        <!-- DASHBOARD -->
        <section>
          <h2 class="h5 mb-3">Tracked Cities</h2>

          <div class="row g-3">

            <!-- WEATHER CARD -->
            <article class="col-md-4 col-sm-6">
              <div class="card h-100">
                <div class="card-body">
                  <h3 class="h6 card-title">São Paulo</h3>
                  <p class="card-text mb-1">🌤️ Partly Cloudy</p>
                  <p class="card-text mb-1">Temperature: 25°C</p>
                  <p class="card-text">Humidity: 68%</p>
                </div>
              </div>
            </article>

            <!-- WEATHER CARD -->
            <article class="col-md-4 col-sm-6">
              <div class="card h-100">
                <div class="card-body">
                  <h3 class="h6 card-title">New York</h3>
                  <p class="card-text mb-1">🌧️ Rain</p>
                  <p class="card-text mb-1">Temperature: 18°C</p>
                  <p class="card-text">Humidity: 75%</p>
                </div>
              </div>
            </article>

            <!-- EMPTY STATE (future use) -->
            <!-- <p>No cities tracked yet.</p> -->

          </div>
        </section>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-top mt-auto">
      <div class="container py-3 text-center">
        <small>
          Built by
          <a href="https://github.com/phmore" target="_blank" rel="noopener noreferrer">
            Patryck Henryck
          </a>
        </small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
